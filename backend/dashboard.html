<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestream AI Multi-Agent & RAG Console (React 18)</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .container { max-width: 1280px; margin: 0 auto; padding: 24px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .grid-5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #334155; color: #e2e8f0; }
    .badge.hot { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .badge.warm { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge.review { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; }
    button { padding: 8px 16px; border-radius: 8px; border: 0; background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #2563eb; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function HeaderBar({ health }) {
      return (
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div>
            <h1 style={{ margin: 0, fontSize: 24, color: '#c4b5fd' }}>
              Livestream Sales Multi-Agent & RAG Console
            </h1>
            <p style={{ margin: '4px 0 0', color: '#94a3b8', fontSize: 13 }}>
              React 18 JSX • Orchestrator: {health?.orchestrator_backend || 'stategraph'} • Vector RAG: {health?.vector_rag_backend || 'local_vector'} • Ollama: {health?.ollama_enabled ? 'enabled' : 'fallback mode'}
            </p>
          </div>
          <span className="badge hot">
            Mongo: {health?.mongo_status || 'n/a'} | Redis: {health?.redis_status || 'n/a'}
          </span>
        </div>
      );
    }

    function KpiStatsRow({ summary, ordersCount }) {
      return (
        <div className="grid-4">
          <div className="card">
            <div style={{ fontSize: 12, color: '#94a3b8' }}>Total Comments</div>
            <div style={{ fontSize: 28, fontWeight: 700 }}>{summary?.comment_count ?? 0}</div>
          </div>
          <div className="card">
            <div style={{ fontSize: 12, color: '#94a3b8' }}>Hot Buyer Leads</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: '#34d399' }}>{summary?.hot_lead_count ?? 0}</div>
          </div>
          <div className="card">
            <div style={{ fontSize: 12, color: '#94a3b8' }}>Needs Human Review</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: '#fbbf24' }}>{summary?.needs_human_review_count ?? 0}</div>
          </div>
          <div className="card">
            <div style={{ fontSize: 12, color: '#94a3b8' }}>Livestream Orders (Auto + Demo)</div>
            <div style={{ fontSize: 28, fontWeight: 700, color: '#a78bfa' }}>{ordersCount}</div>
          </div>
        </div>
      );
    }

    function DatabaseDesignPanel({ dbOverview }) {
      if (!dbOverview) return null;
      return (
        <div className="grid-2">
          <div className="card">
            <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>
              MongoDB: {dbOverview.database_name} ({dbOverview.total_collections} Collections)
            </h3>
            <div style={{ maxHeight: 240, overflowY: 'auto' }}>
              {(dbOverview.collections || []).map((col, idx) => (
                <div
                  key={col.name}
                  style={{
                    padding: '6px 10px',
                    background: '#0f172a',
                    borderRadius: 6,
                    marginTop: 5,
                    fontSize: 12,
                    display: 'flex',
                    justifyContent: 'space-between',
                    alignItems: 'center',
                  }}
                >
                  <div>
                    <strong style={{ color: '#c4b5fd' }}>{idx + 1}. {col.name}</strong>
                    <span style={{ color: '#94a3b8', marginLeft: 8 }}>({col.model})</span>
                  </div>
                  <span className="badge hot">{col.document_count} docs</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>
              Redis Infrastructure ({dbOverview.total_redis_patterns} Key Patterns)
            </h3>
            <div style={{ maxHeight: 240, overflowY: 'auto' }}>
              {(dbOverview.redis_structures || []).map((rs) => (
                <div
                  key={rs.key_pattern}
                  style={{ padding: '6px 10px', background: '#0f172a', borderRadius: 6, marginTop: 5, fontSize: 12 }}
                >
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <code style={{ color: '#93c5fd' }}>{rs.key_pattern}</code>
                    <span className="badge warm">{rs.data_structure}</span>
                  </div>
                  <div style={{ color: '#94a3b8', marginTop: 2, fontSize: 11 }}>{rs.purpose}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function DashboardApp() {
      const [health, setHealth] = useState(null);
      const [arch, setArch] = useState(null);
      const [summary, setSummary] = useState(null);
      const [comments, setComments] = useState([]);
      const [products, setProducts] = useState([]);
      const [orders, setOrders] = useState([]);
      const [dbOverview, setDbOverview] = useState(null);
      const [question, setQuestion] = useState('What is the price and stock of the Aurora Studio Ringlight?');
      const [agentOutput, setAgentOutput] = useState(null);
      const [ragQuery, setRagQuery] = useState('Aurora Studio Ringlight wireless microphone');
      const [ragHits, setRagHits] = useState([]);

      const refresh = async () => {
        try {
          const [h, a, s, c, p, o, db] = await Promise.all([
            fetch('/health').then((r) => r.json()),
            fetch('/api/agent/architecture').then((r) => r.json()),
            fetch('/api/plugin/summary').then((r) => r.json()),
            fetch('/api/plugin/comments?limit=20').then((r) => r.json()),
            fetch('/api/store/products').then((r) => r.json()),
            fetch('/api/store/orders').then((r) => r.json()),
            fetch('/api/database/overview').then((r) => r.json()),
          ]);
          setHealth(h);
          setArch(a);
          setSummary(s);
          setComments(c);
          setProducts(p.items || []);
          setOrders(o.items || []);
          setDbOverview(db);
        } catch (_) {}
      };

      useEffect(() => {
        refresh();
        const id = setInterval(refresh, 4000);
        return () => clearInterval(id);
      }, []);

      const runAgent = async (ev) => {
        ev.preventDefault();
        if (!question.trim()) return;
        const res = await fetch('/api/agent/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: question, sender: 'OperatorTest', author_type: 'viewer' }),
        });
        if (res.ok) setAgentOutput(await res.json());
      };

      const runRag = async (ev) => {
        ev.preventDefault();
        if (!ragQuery.trim()) return;
        const res = await fetch('/api/agent/rag/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: ragQuery, top_k: 4 }),
        });
        if (res.ok) {
          const d = await res.json();
          setRagHits(d.hits || []);
        }
      };

      return (
        <div className="container">
          <HeaderBar health={health} />
          <KpiStatsRow summary={summary} ordersCount={orders.length} />

          <div className="grid-2">
            <div className="card">
              <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Multi-Agent + Tool Calling Playground</h3>
              <form onSubmit={runAgent} style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                <input value={question} onChange={(ev) => setQuestion(ev.target.value)} />
                <button type="submit">Run Agents</button>
              </form>
              {agentOutput?.state && (
                <div style={{ fontSize: 13 }}>
                  <div style={{ padding: 10, borderRadius: 8, background: '#0f172a', marginBottom: 8 }}>
                    <strong>Draft Reply: </strong>
                    {agentOutput.state.answer_draft?.answer}
                    <div style={{ marginTop: 6, color: '#a78bfa', fontSize: 12 }}>
                      Intent: {agentOutput.state.intent} | Lead: {agentOutput.state.lead_label} ({agentOutput.state.lead_score}/100) | Tool: {agentOutput.state.selected_tool || 'none'}
                    </div>
                  </div>
                  {(agentOutput.state.agent_trace || []).map((st, idx) => (
                    <div key={idx} style={{ padding: '6px 8px', background: '#0f172a', borderRadius: 6, marginTop: 4 }}>
                      <strong style={{ color: '#c4b5fd' }}>{st.agent}</strong>: {st.detail}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="card">
              <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Vector RAG Semantic Search</h3>
              <form onSubmit={runRag} style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                <input value={ragQuery} onChange={(ev) => setRagQuery(ev.target.value)} />
                <button type="submit" className="secondary">Search RAG</button>
              </form>
              {ragHits.map((h, idx) => (
                <div key={idx} style={{ padding: 10, background: '#0f172a', borderRadius: 8, marginTop: 8, fontSize: 13 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: '#93c5fd', fontWeight: 600 }}>
                    <span>[{h.source_type}] {h.title} ({h.source_id})</span>
                    <span>score: {h.score}</span>
                  </div>
                  <div style={{ marginTop: 4, color: '#cbd5e1' }}>{h.excerpt}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="card" style={{ marginBottom: 20 }}>
            <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Multi-Agent System Pipeline</h3>
            <div className="grid-5">
              {(arch?.agents || []).map((ag) => (
                <div key={ag.id} style={{ padding: 12, background: '#0f172a', borderRadius: 8, border: '1px solid #475569' }}>
                  <div style={{ fontWeight: 600, color: '#c4b5fd', fontSize: 13 }}>{ag.name}</div>
                  <div style={{ marginTop: 6, fontSize: 12, color: '#94a3b8' }}>{ag.role}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="grid-2">
            <div className="card">
              <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Catalog Products & Inventory ({products.length})</h3>
              <div style={{ maxHeight: 280, overflowY: 'auto' }}>
                {products.map((p) => (
                  <div
                    key={p.product_id}
                    style={{
                      padding: '8px 10px',
                      background: '#0f172a',
                      borderRadius: 8,
                      marginTop: 6,
                      fontSize: 13,
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center',
                    }}
                  >
                    <div>
                      <strong style={{ color: '#f8fafc' }}>{p.name}</strong>
                      <div style={{ fontSize: 11, color: '#94a3b8' }}>{p.product_id} • {p.category}</div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div style={{ fontWeight: 700, color: '#a78bfa' }}>${Number(p.price).toFixed(2)}</div>
                      <span className={`badge ${p.stock_quantity > 0 ? 'hot' : 'review'}`}>
                        Stock: {p.stock_quantity}
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="card">
              <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Livestream Customer Orders ({orders.length})</h3>
              <div style={{ maxHeight: 280, overflowY: 'auto' }}>
                {orders.map((o) => (
                  <div key={o.order_id} style={{ padding: '8px 10px', background: '#0f172a', borderRadius: 8, marginTop: 6, fontSize: 13 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <strong style={{ color: '#93c5fd' }}>
                        {o.order_id} • {o.customer_name} ({o.customer_handle})
                      </strong>
                      <span
                        className={`badge ${
                          o.status === 'delivered' || o.status === 'shipped'
                            ? 'hot'
                            : o.status === 'refund_requested'
                            ? 'review'
                            : 'warm'
                        }`}
                      >
                        {o.status} / {o.payment_status}
                      </span>
                    </div>
                    <div style={{ fontSize: 12, color: '#cbd5e1', marginTop: 4 }}>
                      {(o.items || []).map((it) => `${it.product_name} x${it.quantity}`).join(', ')}
                    </div>
                    <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 3 }}>
                      Total: ${Number(o.total_amount).toFixed(2)} • {o.shipping_address}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <DatabaseDesignPanel dbOverview={dbOverview} />

          <div className="card">
            <h3 style={{ marginTop: 0, color: '#ddd6fe' }}>Live YouTube Comments Stream</h3>
            {comments.map((c) => (
              <div key={c.comment_id} style={{ padding: 12, background: '#0f172a', borderRadius: 8, marginTop: 8 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13 }}>
                  <strong>{c.sender}</strong>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <span className="badge">{c.intent}</span>
                    <span className={`badge ${c.lead_label}`}>Lead: {c.lead_label} ({c.lead_score})</span>
                    {c.auto_order && (
                      <span className="badge hot">
                        Order #{c.auto_order.order_id} (${Number(c.auto_order.total_amount).toFixed(2)})
                      </span>
                    )}
                    {c.needs_human_review && <span className="badge review">Needs Review</span>}
                  </div>
                </div>
                <div style={{ marginTop: 6 }}>{c.text}</div>
                {(c.thread_messages || []).map((m, idx) => (
                  <div key={idx} style={{ marginTop: 8, padding: 8, borderRadius: 6, background: '#1e1b4b', color: '#ddd6fe', fontSize: 13 }}>
                    <strong style={{ color: '#6ee7b7' }}>{m.sender}: </strong>
                    {m.text}
                  </div>
                ))}
                {(!c.thread_messages || !c.thread_messages.length) && c.answer_draft?.answer && (
                  <div style={{ marginTop: 8, padding: 8, borderRadius: 6, background: '#334155', color: '#fcd34d', fontSize: 13 }}>
                    <strong>Pending Operator Review: </strong>
                    {c.answer_draft.answer}
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
