<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101819">
  <title>Live Desk · Moderation</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #101819;
      --panel: #182324;
      --panel-soft: #121b1c;
      --line: #304142;
      --text: #edf2ec;
      --muted: #9aaba7;
      --faint: #71817e;
      --mint: #a9e3ce;
      --lime: #d7ed85;
      --coral: #ff8873;
      --amber: #f2c56b;
      --blue: #88c7e4;
      --radius: 7px;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(ellipse at 9% 0%, rgba(87, 136, 117, .12), transparent 30rem), var(--page);
      font-family: "Aptos", "Segoe UI", sans-serif;
      font-size: 13px;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { max-width: 1380px; margin: auto; padding: 0 28px 28px; }
    .topbar { height: 66px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px 9px 3px 9px; background: var(--lime); color: #17201c; font-size: 11px; font-weight: 850; }
    .brand-name { font-size: 14px; font-weight: 720; }
    .brand-subtitle { margin-left: 9px; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 15px; }
    .connection { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .connection.online { color: var(--mint); }
    .connection.online .connection-dot { background: #79d5a5; }
    .connection.offline { color: var(--coral); }
    .connection.offline .connection-dot { background: var(--coral); }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; padding: 23px 0 18px; }
    .eyebrow { color: var(--lime); font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .1em; }
    h1 { margin: 6px 0 0; font-size: 22px; line-height: 1.2; font-weight: 700; }
    .readonly { color: var(--muted); font-size: 11px; }

    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 720px; }
    .metric { min-height: 77px; padding: 13px 15px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(24, 35, 36, .86); }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { display: block; margin-top: 6px; font-size: 23px; line-height: 1; font-weight: 720; font-variant-numeric: tabular-nums; }
    .metric.review .metric-value { color: var(--amber); }
    .metric.blocked .metric-value { color: var(--coral); }

    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 14px; align-items: start; }
    .panel { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(24, 35, 36, .92); }
    .panel-head { min-height: 57px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
    .panel-title { margin: 0; font-size: 13px; font-weight: 690; }
    .panel-subtitle { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .filters { display: flex; gap: 5px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .filter { min-height: 27px; padding: 4px 9px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; font-size: 10px; }
    .filter:hover { background: #202e2f; color: var(--text); }
    .filter.active { border-color: #47665d; color: var(--mint); background: rgba(169, 227, 206, .08); }
    .queue { max-height: min(66vh, 680px); overflow: auto; scrollbar-color: #405253 transparent; }
    .comment { width: 100%; display: block; padding: 12px 14px; border: 0; border-bottom: 1px solid rgba(48, 65, 66, .7); background: transparent; text-align: left; cursor: pointer; }
    .comment:hover { background: rgba(215, 237, 133, .035); }
    .comment-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .sender { overflow: hidden; color: var(--text); font-weight: 660; text-overflow: ellipsis; white-space: nowrap; }
    .time { flex: 0 0 auto; color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
    .comment-text { display: block; margin-top: 6px; color: #d6dfd9; line-height: 1.45; overflow-wrap: anywhere; }
    .comment-status { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { display: inline-flex; align-items: center; min-height: 19px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-size: 9px; }
    .tag.intent { color: var(--blue); border-color: rgba(136, 199, 228, .24); }
    .tag.review { color: var(--amber); border-color: rgba(242, 197, 107, .3); }
    .tag.blocked { color: var(--coral); border-color: rgba(255, 136, 115, .34); }
    .tag.allowed { color: var(--mint); border-color: rgba(169, 227, 206, .23); }
    .empty { padding: 38px 16px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--text); font-weight: 650; }

    .footer { display: flex; justify-content: space-between; gap: 10px; padding: 12px 2px 0; color: var(--faint); font-size: 10px; }

    @media (max-width: 850px) {
      .shell { padding: 0 16px 22px; }
      .queue { max-height: 48vh; }
    }
    @media (max-width: 560px) {
      .shell { padding: 0 10px 18px; }
      .brand-subtitle { display: none; }
      .heading { align-items: start; flex-direction: column; gap: 7px; }
      h1 { font-size: 20px; }
      .metrics { gap: 6px; }
      .metric { min-height: 68px; padding: 10px; }
      .metric-value { font-size: 20px; }
      .panel-head { align-items: start; flex-direction: column; }
      .filters { overflow-x: auto; }
      .filter { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">LD</div>
        <div><span class="brand-name">Live Desk</span><span class="brand-subtitle">YouTube moderation</span></div>
      </div>
      <div class="top-actions">
        <div class="connection" id="connection-status" aria-live="polite"><span class="connection-dot"></span><span id="connection-label">Đang kết nối</span></div>
      </div>
    </header>

    <section class="heading">
      <div><div class="eyebrow">Live moderation</div><h1>Hàng đợi bình luận</h1></div>
      <div class="readonly">Read-only · Không tự gửi chat</div>
    </section>

    <section class="metrics" aria-label="Tình hình cần xử lý">
      <div class="metric review"><div class="metric-label">Cần mod xem</div><strong class="metric-value" id="metric-review">—</strong></div>
      <div class="metric blocked"><div class="metric-label">Bị lọc</div><strong class="metric-value" id="metric-blocked">—</strong></div>
    </section>

    <main class="workspace">
      <section class="panel" aria-labelledby="queue-heading">
        <div class="panel-head"><div><h2 class="panel-title" id="queue-heading">Comment cần xử lý</h2><div class="panel-subtitle" id="queue-count">Đang chờ dữ liệu</div></div></div>
        <div class="filters" role="group" aria-label="Lọc comment">
          <button class="filter active" data-filter="review" type="button">Cần xem</button>
          <button class="filter" data-filter="blocked" type="button">Đã lọc</button>
        </div>
        <div class="queue" id="comment-list" aria-live="polite">
          <div class="empty"><strong>Đang chờ comment</strong>Mở livestream có live chat để nhận bình luận.</div>
        </div>
      </section>
    </main>

    <footer class="footer"><span>Đồng bộ tự động mỗi 3 giây · Lịch sử trong bộ nhớ</span><span id="last-updated">Chưa cập nhật</span></footer>
  </div>

  <script>
    (() => {
      const POLL_INTERVAL_MS = 3000;
      const INTENT_LABELS = {
        prompt_injection: 'Prompt injection', refund_request: 'Hoàn tiền',
        price_change_request: 'Đổi giá', consequential_action: 'Thao tác cần duyệt',
        complaint: 'Khiếu nại', spam_or_irrelevant: 'Spam / ngoài phạm vi',
        promotion_question: 'Khuyến mãi', shipping_policy: 'Vận chuyển',
        return_policy: 'Đổi trả', stock_question: 'Tồn kho',
        price_question: 'Giá', product_information: 'Thông tin sản phẩm', unknown: 'Chưa rõ'
      };
      const state = { comments: [], summary: null, filter: 'review', polling: false };
      const $ = (selector) => document.querySelector(selector);

      function make(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function formatTime(timestamp) {
        const date = new Date(timestamp);
        return Number.isNaN(date.getTime()) ? '—' : new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(date);
      }

      function setConnection(online) {
        const status = $('#connection-status');
        status.classList.toggle('online', online);
        status.classList.toggle('offline', !online);
        $('#connection-label').textContent = online ? 'Backend online' : 'Backend offline';
      }

      function renderMetrics() {
        $('#metric-review').textContent = state.summary?.needs_human_review_count ?? state.comments.filter((item) => item.needs_human_review).length;
        $('#metric-blocked').textContent = state.summary?.moderated_comment_count ?? state.comments.filter((item) => item.moderation_status === 'blocked').length;
        $('#last-updated').textContent = `Cập nhật ${formatTime(Date.now())}`;
      }

      function isVisible(comment) {
        if (state.filter === 'review' && !comment.needs_human_review) return false;
        if (state.filter === 'blocked' && comment.moderation_status !== 'blocked') return false;
        return true;
      }

      function renderComment(comment) {
        const item = make('article', 'comment');
        const head = make('span', 'comment-head');
        head.append(make('span', 'sender', comment.sender), make('span', 'time', formatTime(comment.timestamp)));
        item.append(head, make('span', 'comment-text', comment.text));
        const statuses = make('span', 'comment-status');
        statuses.append(make('span', 'tag intent', INTENT_LABELS[comment.intent] || comment.intent));
        if (comment.moderation_status === 'blocked') statuses.append(make('span', 'tag blocked', 'Đã lọc'));
        else if (comment.needs_human_review) statuses.append(make('span', 'tag review', 'Cần xem'));
        item.append(statuses);
        return item;
      }

      function renderComments() {
        const root = $('#comment-list');
        root.replaceChildren();
        const comments = state.comments.filter(isVisible);
        const queueLabel = state.filter === 'blocked' ? 'đã lọc' : 'cần mod xem';
        $('#queue-count').textContent = `${comments.length} comment ${queueLabel}`;
        if (!comments.length) {
          const empty = make('div', 'empty');
          const isWaiting = state.comments.length === 0;
          const emptyTitle = isWaiting
            ? 'Đang chờ comment'
            : state.filter === 'blocked'
              ? 'Không có comment đã lọc'
              : 'Không có comment cần xem';
          empty.append(make('strong', '', emptyTitle));
          empty.append(document.createTextNode(isWaiting ? 'Mở livestream có live chat để nhận bình luận.' : 'Các comment cần xử lý sẽ xuất hiện tại đây.'));
          root.append(empty);
          return;
        }
        for (const comment of comments) root.append(renderComment(comment));
      }

      async function refresh() {
        if (state.polling) return;
        state.polling = true;
        try {
          const [healthResponse, commentsResponse, summaryResponse] = await Promise.all([
            fetch('/health', { cache: 'no-store' }),
            fetch('/api/plugin/comments?limit=100', { cache: 'no-store' }),
            fetch('/api/plugin/summary', { cache: 'no-store' })
          ]);
          if (!healthResponse.ok || !commentsResponse.ok || !summaryResponse.ok) throw new Error('Backend response error');
          const [health, comments, summary] = await Promise.all([healthResponse.json(), commentsResponse.json(), summaryResponse.json()]);
          setConnection(health.status === 'ok');
          state.comments = Array.isArray(comments) ? comments : [];
          state.summary = summary;
          renderMetrics();
          renderComments();
        } catch (_error) {
          setConnection(false);
          $('#last-updated').textContent = 'Không lấy được dữ liệu';
        } finally {
          state.polling = false;
        }
      }

      document.querySelectorAll('[data-filter]').forEach((button) => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach((item) => item.classList.toggle('active', item === button));
          renderComments();
        });
      });
      refresh();
      window.setInterval(refresh, POLL_INTERVAL_MS);
    })();
  </script>
</body>
</html>
