[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livestream-ai-data"
version = "0.1.0"
description = "AI and data components for a simulated sales livestream"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
server = [
	"fastapi>=0.110",
	"pydantic>=2.6",
	"python-dotenv>=1.0",
	"scikit-learn>=1.4",
	"uvicorn>=0.27",
]
[tool.setuptools.packages.find]
include = ["ai*", "backend*"]

[tool.setuptools.package-data]
backend = ["*.json"]
