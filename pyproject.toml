[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livestream-ai-data"
version = "0.1.0"
description = "AI and data components for a simulated sales livestream"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]