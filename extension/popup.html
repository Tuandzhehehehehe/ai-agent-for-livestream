<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livestream AI Assistant (React)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 360px;
      min-height: 420px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .popup-root { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 15px; font-weight: 700; color: #c4b5fd; margin: 0; }
    .subtitle { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .status-pill { padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .status-pill.online { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .status-pill.offline { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-label { font-size: 11px; color: #94a3b8; }
    .stat-value { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 0;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      background: #7c3aed;
      color: #fff;
    }
    .btn.secondary { background: #2563eb; margin-top: 6px; }
    .comment-item {
      padding: 8px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 12px;
      margin-top: 6px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      background: #334155;
      color: #e2e8f0;
      margin-left: 4px;
    }
    .badge.order { background: rgba(16, 185, 129, 0.25); color: #6ee7b7; }
  </style>
</head>
<body>
  <div id="popup-root"></div>
  <script type="module" src="src/popup/popup.js"></script>
</body>
</html>
