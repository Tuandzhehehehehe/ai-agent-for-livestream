<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Shopee Live AI Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="logo">
        <span class="icon">AI</span>
        <h1>Shopee AI Copilot</h1>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <div class="card">
      <label for="backend-url">Địa chỉ Backend AI Server:</label>
      <input type="text" id="backend-url" placeholder="http://localhost:8000">
      <button class="save-btn" id="btn-save">Lưu Cấu Hình</button>
    </div>

    <div class="card help-card">
      <div class="hint">Phím tắt:</div>
      <div><kbd>Alt</kbd> + <kbd>1</kbd> : Gửi nhanh gợi ý trên cùng</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
